<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motoristas · Mano Melancias</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="auth-veil" id="auth-veil">Carregando…</div>
  <div class="sidebar-scrim" data-sidebar-scrim></div>

  <div class="app-shell" data-auth-gate>
    <aside class="sidebar">
      <div class="sidebar__brand">
          <a href="index.html"><img src="assets/img/logo_mano_melancias.png" alt=""></a>
        <div class="sidebar__brand-text">Mano Melancias<span>Gestão de vendas</span></div>
      </div>
      <a href="venda-form.html" class="sidebar__cta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M12 5v14M5 12h14"/></svg>Nova venda</a>
      <nav class="sidebar__nav">
        <a href="index.html" class="sidebar__link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h3v-6h6v6h3a1 1 0 0 0 1-1v-9"/></svg>Painel</a>
        <a href="vendas.html" class="sidebar__link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l3 3v17H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Vendas</a>
        <a href="clientes.html" class="sidebar__link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V7l8-4 8 4v14"/><path d="M9 21v-6h6v6M9 11h.01M15 11h.01M9 15h.01M15 15h.01"/></svg>Clientes</a>
        <a href="produtores.html" class="sidebar__link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-9"/><path d="M12 13c0-4-3-7-7-7 0 4 3 7 7 7Z"/><path d="M12 13c0-5 3-9 8-9 0 5-3 9-8 9Z"/></svg>Produtores</a>
        <a href="motoristas.html" class="sidebar__link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>Motoristas</a>
        <a href="veiculos.html" class="sidebar__link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16V9a1 1 0 0 1 1-1h9l4 4h3a1 1 0 0 1 1 1v3"/><path d="M3 16h1m16 0h1M3 16a2 2 0 1 0 4 0M17 16a2 2 0 1 0 4 0M7 16h6"/></svg>Veículos</a>
        <a href="relatorios.html" class="sidebar__link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M11 20V4M18 20v-7"/></svg>Relatórios</a>
        <a href="usuarios.html" class="sidebar__link" data-requires-admin><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M2 21c0-3.3 3-6 7-6s7 2.7 7 6"/><path d="M16 4.2a3 3 0 0 1 0 5.6M20 21c0-2.7-1.8-5-4.3-5.8"/></svg>Usuários</a>
      </nav>
      <div class="sidebar__footer">
        <div class="sidebar__user">
          <div class="sidebar__user-email" data-user-email></div>
          <span class="sidebar__user-papel" data-user-papel></span>
        </div>
        <button type="button" class="sidebar__logout" data-logout><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>Sair</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="row">
          <button type="button" class="menu-toggle" data-menu-toggle aria-label="Abrir menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" width="20" height="20"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
          <div class="topbar__title">
            <div>
              <h1>Motoristas</h1>
              <div class="topbar__subtitle">Motoristas que transportam as cargas</div>
            </div>
          </div>
        </div>
        <div class="topbar__actions">
          <button type="button" class="btn btn-primary" id="btn-new">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            Novo motorista
          </button>
        </div>
      </header>

      <main class="content">
        <div class="card">
          <form class="filter-bar" id="filter-form">
            <div class="field field--grow">
              <label for="f-nome">Nome</label>
              <input class="input" type="text" id="f-nome" placeholder="Buscar por nome...">
            </div>
            <button type="submit" class="btn btn-secondary">Buscar</button>
          </form>

          <div class="card__body card__body--tight">
            <div class="table-wrap">
              <table class="table">
                <thead>
                  <tr><th>Nome</th><th>CPF</th><th>Telefone</th><th></th></tr>
                </thead>
                <tbody id="motoristas-body"></tbody>
              </table>
            </div>
            <div class="empty-state" id="motoristas-empty" hidden>
              <h3>Nenhum motorista encontrado</h3>
              <p>Cadastre o primeiro motorista ou ajuste a busca.</p>
              <button type="button" class="btn btn-primary btn-sm" id="empty-new">Novo motorista</button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal">
      <div class="modal__header">
        <h2 id="modal-title">Novo motorista</h2>
        <button type="button" class="modal__close" data-modal-close aria-label="Fechar">&times;</button>
      </div>
      <form id="entity-form" novalidate>
        <div class="modal__body">
          <div class="field">
            <label for="m-nome">Nome</label>
            <input class="input" type="text" id="m-nome" placeholder="Ex: Tiago" required>
            <span class="error-msg" data-field-error-for="nome" hidden></span>
          </div>
          <div class="field">
            <label for="m-cpf">CPF</label>
            <input class="input" type="text" id="m-cpf" placeholder="000.000.000-00" inputmode="numeric" required>
            <span class="error-msg" data-field-error-for="cpf" hidden></span>
          </div>
          <div class="field">
            <label for="m-telefone">Telefone <span class="text-faint">(opcional)</span></label>
            <input class="input" type="text" id="m-telefone" placeholder="(00) 00000-0000">
            <span class="error-msg" data-field-error-for="telefone" hidden></span>
          </div>
        </div>
        <div class="modal__footer">
          <button type="button" class="btn btn-secondary" data-modal-close>Cancelar</button>
          <button type="submit" class="btn btn-primary" id="form-submit">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/format.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/pages/motoristas.js"></script>
</body>
</html>
